name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.90 (per rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90.0"
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
        env:
          # GitHub-hosted runners preinstall Git LFS filters in the system/global
          # git config. Duet's merge safety check reads `git config` across all
          # scopes and refuses repos with custom filters, so every merge test
          # would fail on the runner while passing on a clean machine. Isolate
          # the test step from the host's git config; repo-local config is kept.
          GIT_CONFIG_SYSTEM: /dev/null
          GIT_CONFIG_GLOBAL: /dev/null
